<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Apply — Pac I G, LLC Loan Application | pacig.net</title>
<meta name="description" content="Apply for a Hawaii construction loan, rehab loan, fix & flip, bridge or hard money loan with Pacific Investment Group LLC. (808) 523-2000.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://pacig.net/apply.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background: #1A4A5C;
    height: 100%;
    overflow-x: hidden;
  }

  /* ── ONE THIN BAR ── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.6rem 1.2rem;
    background: #2C1810;
    border-bottom: 2px solid #C9A84C;
    height: 44px;
  }
  .topbar-logo {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 1rem; font-weight: 400;
    color: #E8D49A; text-decoration: none;
    white-space: nowrap;
  }
  .topbar-logo em { font-style: italic; color: #C9A84C; }
  .topbar-right {
    display: flex; align-items: center; gap: 1rem;
  }
  .topbar-phone {
    font-size: 0.78rem; color: rgba(245,239,224,0.55);
    text-decoration: none;
  }
  .topbar-phone:hover { color: #E8D49A; }
  .topbar-back {
    font-size: 0.7rem; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: #2C1810; background: #C9A84C;
    padding: 0.3rem 0.8rem; text-decoration: none;
    transition: background 0.2s; white-space: nowrap;
  }
  .topbar-back:hover { background: #E8D49A; }

  /* ── JOTFORM FILLS THE REST ── */
  .form-wrap {
    width: 100%;
    /* full viewport minus the 44px topbar */
    height: calc(100vh - 44px);
  }
  .form-wrap iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  @media (max-width: 480px) {
    .topbar { padding: 0.5rem 0.8rem; }
    .topbar-logo { font-size: 0.88rem; }
    .topbar-phone { display: none; }
  }
</style>
</head>
<body>

<!-- ONE THIN BAR — 44px total -->
<div class="topbar">
  <a class="topbar-logo" href="index.html" target="_blank" rel="noopener">
    Pacific Investment <em>Group</em>
  </a>
  <div class="topbar-right">
    <a class="topbar-phone" href="tel:+18085232000">(808) 523-2000</a>
    <a class="topbar-back" href="index.html" target="_blank" rel="noopener">← Main Site</a>
  </div>
</div>

<!-- JOTFORM — fills everything below the bar -->
<div class="form-wrap">
  <iframe
    id="jf"
    title="Pac I G, LLC Loan Application"
    src="https://form.jotform.com/240036322954148"
    allow="geolocation; microphone; camera"
    allowfullscreen
    scrolling="yes">
  </iframe>
</div>

<script>
  // Let JotForm resize itself; scroll back to top of iframe on step change
  window.addEventListener('message', function(e) {
    if (!e.data) return;
    try {
      var msg = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
      if (msg.action === 'scrollIntoView') {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    } catch(err) {}
  });
</script>

</body>
</html>
